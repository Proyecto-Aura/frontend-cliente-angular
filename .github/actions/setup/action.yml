name: Preparar entorno
description: Instala Node (version de .nvmrc, con cache de npm) e instala dependencias. Requiere actions/checkout antes.

runs:
  using: composite
  steps:
    - name: Instalar Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Instalar dependencias
      run: npm ci
      shell: bash
