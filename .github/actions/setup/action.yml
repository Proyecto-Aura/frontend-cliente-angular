name: Preparar entorno
description: Instala Node (version de .nvmrc, con cache de npm) e instala dependencias. Requiere actions/checkout antes.

runs:
  using: composite
  steps:
    - name: Instalar Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Instalar dependencias
      run: npm ci
      shell: bash
