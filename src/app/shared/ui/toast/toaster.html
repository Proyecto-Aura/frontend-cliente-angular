@for (t of toast.toasts(); track t.id) {
  <div
    class="pointer-events-auto flex items-start gap-3 rounded-lg border border-border bg-white px-4 py-3 shadow-md"
    role="status"
  >
    <span
      aria-hidden="true"
      class="mt-[7px] size-[7px] shrink-0 rounded-full"
      [class.bg-success]="t.type === 'success'"
      [class.bg-warning]="t.type === 'warning'"
      [class.bg-destructive]="t.type === 'error'"
      [class.bg-info]="t.type === 'info'"
    ></span>
    <div class="flex-1">
      <p class="text-[14px] font-medium text-foreground">{{ t.title }}</p>
      @if (t.description) {
        <p class="mt-0.5 text-[12px] text-muted-foreground">{{ t.description }}</p>
      }
    </div>
    <button
      type="button"
      (click)="toast.dismiss(t.id)"
      aria-label="Cerrar"
      class="flex size-6 cursor-pointer items-center justify-center rounded-md text-muted-foreground transition-colors duration-[120ms] hover:bg-accent hover:text-primary"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>
}
