@if (title()) {
  <header class="flex items-center justify-between gap-4 border-b border-border px-5 py-4">
    <div>
      <h3 class="text-[16px] font-medium text-foreground">{{ title() }}</h3>
      @if (subtitle()) {
        <p class="mt-0.5 text-[12px] text-muted-foreground">{{ subtitle() }}</p>
      }
    </div>
    <div class="flex items-center gap-2 empty:hidden">
      <ng-content select="[slot=actions]" />
    </div>
  </header>
}

<div [class]="bodyClasses()">
  <ng-content />
</div>

<footer class="border-t border-border bg-background px-5 py-3 empty:hidden">
  <ng-content select="[slot=footer]" />
</footer>
