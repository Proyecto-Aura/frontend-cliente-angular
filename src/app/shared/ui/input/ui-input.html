<div class="flex flex-col gap-1.5">
  <span class="flex items-center justify-between gap-2 empty:hidden">
    @if (label()) {
      <label [for]="id" class="text-[13px] font-semibold text-label">{{ label() }}</label>
    }
    <ng-content select="[slot=action]" />
  </span>

  <span class="relative block">
    <input
      [id]="id"
      [type]="resolvedType()"
      [value]="value()"
      [disabled]="disabled()"
      [placeholder]="placeholder()"
      [attr.autocomplete]="autocomplete()"
      [attr.inputmode]="inputMode()"
      [attr.maxlength]="maxLength()"
      [attr.aria-invalid]="visibleError() ? true : null"
      [attr.aria-describedby]="visibleError() || hint() ? id + '-msg' : null"
      (input)="onInput($event)"
      (blur)="onTouched()"
      [class]="fieldClasses"
      class="h-[40px]"
      [class.pr-10]="type() === 'password'"
      [class.border-brand-600]="!!visibleError()"
      [class.border-line-soft]="!visibleError()"
    />

    @if (type() === 'password') {
      <button
        type="button"
        (click)="show.set(!show())"
        [attr.aria-label]="show() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-muted hover:text-ink-soft"
      >
        @if (show()) {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
            <line x1="2" x2="22" y1="2" y2="22" />
          </svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        }
      </button>
    }
  </span>

  <app-ui-field-message [for]="id" [hint]="hint()" [error]="visibleError()" />
</div>
