<div class="flex flex-col gap-1.5">
  <label [for]="id" class="flex cursor-pointer items-center gap-2.5 text-[13px] text-label">
    <input
      [id]="id"
      type="checkbox"
      [checked]="value()"
      [disabled]="disabled()"
      [attr.aria-invalid]="error() ? true : null"
      [attr.aria-describedby]="error() || hint() ? id + '-msg' : null"
      (change)="onToggle($event)"
      class="size-5 shrink-0 cursor-pointer rounded-lg border-[1.25px] border-line accent-brand-600 disabled:cursor-not-allowed"
    />
    <span><ng-content /></span>
  </label>

  <app-ui-field-message [for]="id" [hint]="hint()" [error]="error()" />
</div>
