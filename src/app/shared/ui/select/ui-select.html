<div class="flex flex-col gap-1.5">
  @if (label()) {
    <label [for]="id" class="text-[13px] font-semibold text-label">{{ label() }}</label>
  }

  <span class="relative block">
    <select
      [id]="id"
      [disabled]="disabled()"
      [attr.aria-invalid]="error() ? true : null"
      [attr.aria-describedby]="error() || hint() ? id + '-msg' : null"
      (change)="onChangeEvent($event)"
      (blur)="onTouched()"
      [class]="fieldClasses"
      class="h-[40px] cursor-pointer appearance-none pr-10"
      [class.border-brand-600]="!!error()"
      [class.border-line-soft]="!error()"
    >
      @if (placeholder()) {
        <option value="" disabled [selected]="value() === ''">{{ placeholder() }}</option>
      }
      @for (opt of options(); track opt.value) {
        <option [value]="opt.value" [selected]="opt.value === value()">{{ opt.label }}</option>
      }
    </select>
    <svg
      class="pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2 text-muted"
      width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </span>

  <app-ui-field-message [for]="id" [hint]="hint()" [error]="error()" />
</div>
