<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  @switch (name()) {
    @case ('arrow-left') {
      <svg:path d="m12 19-7-7 7-7" />
      <svg:path d="M19 12H5" />
    }
    @case ('check') {
      <svg:path d="M20 6 9 17l-5-5" />
    }
    @case ('circle-check') {
      <svg:circle cx="12" cy="12" r="10" />
      <svg:path d="m9 12 2 2 4-4" />
    }
    @case ('chevron-down') {
      <svg:path d="m6 9 6 6 6-6" />
    }
    @case ('chevron-right') {
      <svg:path d="m9 18 6-6-6-6" />
    }
    @case ('log-out') {
      <svg:path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      <svg:polyline points="16 17 21 12 16 7" />
      <svg:line x1="21" x2="9" y1="12" y2="12" />
    }
    @case ('mail') {
      <svg:rect width="20" height="16" x="2" y="4" rx="2" />
      <svg:path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
    }
    @case ('map-pin') {
      <svg:path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
      <svg:circle cx="12" cy="10" r="3" />
    }
    @case ('minus') {
      <svg:path d="M5 12h14" />
    }
    @case ('phone') {
      <svg:path
        d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
      />
    }
    @case ('plus') {
      <svg:path d="M5 12h14" />
      <svg:path d="M12 5v14" />
    }
    @case ('search') {
      <svg:circle cx="11" cy="11" r="8" />
      <svg:path d="m21 21-4.3-4.3" />
    }
    @case ('search-x') {
      <svg:path d="m13.5 8.5-5 5" />
      <svg:path d="m8.5 8.5 5 5" />
      <svg:circle cx="11" cy="11" r="8" />
      <svg:path d="m21 21-4.3-4.3" />
    }
    @case ('shopping-cart') {
      <svg:circle cx="8" cy="21" r="1" />
      <svg:circle cx="19" cy="21" r="1" />
      <svg:path
        d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"
      />
    }
    @case ('sliders-horizontal') {
      <svg:line x1="21" x2="14" y1="4" y2="4" />
      <svg:line x1="10" x2="3" y1="4" y2="4" />
      <svg:line x1="21" x2="12" y1="12" y2="12" />
      <svg:line x1="8" x2="3" y1="12" y2="12" />
      <svg:line x1="21" x2="16" y1="20" y2="20" />
      <svg:line x1="12" x2="3" y1="20" y2="20" />
      <svg:line x1="14" x2="14" y1="2" y2="6" />
      <svg:line x1="8" x2="8" y1="10" y2="14" />
      <svg:line x1="16" x2="16" y1="18" y2="22" />
    }
    @case ('user') {
      <svg:circle cx="12" cy="8" r="5" />
      <svg:path d="M20 21a8 8 0 0 0-16 0" />
    }
    @case ('x') {
      <svg:path d="M18 6 6 18" />
      <svg:path d="m6 6 12 12" />
    }
  }
</svg>
