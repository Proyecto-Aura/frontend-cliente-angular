@if (avisos.actual(); as aviso) {
  <div
    class="fixed right-6 z-[70] w-full max-w-md transition-transform duration-300 ease-out"
    [class]="(enAuth() ? 'top-6' : 'top-20') + ' ' + (avisos.visible() ? 'translate-x-0' : 'translate-x-[120%]')"
  >
    <app-alert [tone]="aviso.tono" [title]="aviso.titulo" [description]="aviso.detalle ?? null" [closable]="false">
      @if (aviso.enlace; as enlace) {
        <a
          [routerLink]="enlace.ruta"
          [queryParams]="enlace.queryParams ?? null"
          class="mt-1 w-fit text-[13px] font-semibold underline decoration-2 underline-offset-2"
        >
          {{ enlace.etiqueta }}
        </a>
      }
    </app-alert>
  </div>
}
