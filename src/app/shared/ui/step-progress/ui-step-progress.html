<div
  role="progressbar"
  [attr.aria-valuenow]="step()"
  aria-valuemin="0"
  [attr.aria-valuemax]="total()"
  [attr.aria-label]="'Paso ' + step() + ' de ' + total()"
  class="flex gap-2"
>
  @for (i of segments(); track i) {
    <span
      class="h-1 flex-1 rounded-full transition-colors duration-[120ms]"
      [class.bg-primary]="i < step()"
      [class.bg-border]="i >= step()"
    ></span>
  }
</div>
