<div class="flex flex-col gap-2">
  @if (label()) {
    <app-ui-field-label [for]="id" [required]="required()">{{ label() }}</app-ui-field-label>
  }

  <textarea
    [id]="id"
    [rows]="rows()"
    [value]="value()"
    [disabled]="disabled()"
    [required]="required()"
    [placeholder]="placeholder()"
    [attr.maxlength]="maxLength()"
    [attr.aria-invalid]="visibleError() ? true : null"
    [attr.aria-describedby]="visibleError() || hint() ? id + '-msg' : null"
    (input)="onInput($event)"
    (blur)="onTouched()"
    [class]="fieldClass()"
    class="resize-y py-3"
  ></textarea>

  <app-ui-field-message [for]="id" [hint]="hint()" [error]="visibleError()" />
</div>
