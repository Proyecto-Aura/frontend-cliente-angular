<div
  role="group"
  [attr.aria-label]="label()"
  class="flex h-11 items-center overflow-hidden rounded-field border border-border bg-white shadow-field"
>
  <button
    type="button"
    (click)="decrease()"
    [disabled]="!canDecrease()"
    aria-label="Restar"
    class="flex h-full w-11 cursor-pointer items-center justify-center text-muted-foreground transition-colors duration-[120ms] hover:bg-accent hover:text-primary focus-visible:shadow-focus focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-45 disabled:hover:bg-transparent disabled:hover:text-muted-foreground"
  >
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14" /></svg>
  </button>
  <span aria-live="polite" class="w-10 text-center text-[14px] font-medium text-foreground tabular-nums">{{ value() }}</span>
  <button
    type="button"
    (click)="increase()"
    [disabled]="!canIncrease()"
    aria-label="Sumar"
    class="flex h-full w-11 cursor-pointer items-center justify-center text-muted-foreground transition-colors duration-[120ms] hover:bg-accent hover:text-primary focus-visible:shadow-focus focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-45 disabled:hover:bg-transparent disabled:hover:text-muted-foreground"
  >
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
  </button>
</div>
