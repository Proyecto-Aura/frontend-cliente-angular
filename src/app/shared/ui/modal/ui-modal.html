<button
  type="button"
  (click)="closed.emit()"
  aria-label="Cerrar"
  tabindex="-1"
  class="absolute inset-0 cursor-default bg-black/40"
></button>

<div
  #panel
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="titleId"
  tabindex="-1"
  class="animate-scale-in relative flex max-h-[calc(100vh-2rem)] w-full flex-col gap-5 overflow-y-auto rounded-2xl bg-surface p-7 shadow-2xl outline-none"
  [style.max-width.px]="size() === 'sm' ? 420 : 480"
>
  <div class="flex items-center justify-between gap-4">
    <h2 [id]="titleId" class="font-display text-[18px] font-black text-ink">{{ title() }}</h2>
    <button
      type="button"
      (click)="closed.emit()"
      aria-label="Cerrar"
      class="flex size-8 shrink-0 cursor-pointer items-center justify-center rounded-lg text-ink-soft transition-colors hover:bg-[#f0f0f0]"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>

  <ng-content />

  <div class="flex justify-end gap-3 empty:hidden">
    <ng-content select="[slot=footer]" />
  </div>
</div>
