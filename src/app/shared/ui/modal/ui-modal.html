<button
  type="button"
  (click)="closed.emit()"
  aria-label="Cerrar"
  tabindex="-1"
  class="absolute inset-0 cursor-default bg-[rgb(33_33_33/0.45)]"
></button>

<div
  #panel
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="titleId"
  tabindex="-1"
  class="relative flex max-h-full w-full flex-col overflow-hidden rounded-lg bg-white text-foreground shadow-lg outline-none"
  [style.max-width.px]="maxWidth()"
>
  <header class="flex shrink-0 items-center gap-3 bg-primary px-6 py-[18px] text-white">
    <ng-content select="[slot=icon]" />
    <div class="min-w-0 flex-1">
      <h3 [id]="titleId" class="text-[16px] font-semibold text-white">{{ title() }}</h3>
      @if (description()) {
        <p class="mt-0.5 text-[12px] text-white/80">{{ description() }}</p>
      }
    </div>
    <button
      type="button"
      (click)="closed.emit()"
      aria-label="Cerrar"
      class="cursor-pointer p-0.5 text-[18px] leading-none text-white opacity-90 hover:opacity-100 focus-visible:shadow-[0_0_0_3px_rgb(255_255_255/0.5)] focus-visible:outline-none"
    >✕</button>
  </header>

  <div class="min-h-0 flex-1 overflow-y-auto p-6">
    <ng-content />
  </div>

  <footer
    class="flex shrink-0 items-center justify-between gap-4 border-t border-border bg-white px-6 py-3.5 [&:not(:has(.ui-modal-hint,.ui-modal-actions>*))]:hidden"
  >
    @if (hint()) {
      <span class="ui-modal-hint text-[12px] text-muted-foreground">{{ hint() }}</span>
    } @else {
      <span></span>
    }
    <span class="ui-modal-actions flex justify-end gap-2"><ng-content select="[slot=footer]" /></span>
  </footer>
</div>
