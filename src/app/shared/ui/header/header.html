<nav
  class="flex h-[68px] shrink-0 items-center bg-gradient-to-r from-brand-700 to-brand-600 px-6 lg:px-12"
>
  <a routerLink="/catalogo" class="mr-6 flex shrink-0 items-center gap-2.5 lg:mr-12">
    <span class="flex size-9 shrink-0 items-center justify-center rounded-xl bg-white/20">
      <img ngSrc="/francos-icon.png" alt="Franco's" width="28" height="28" class="size-7 object-contain" />
    </span>
    <span class="font-display text-[20px] font-extrabold tracking-[-0.4px] text-white">Franco's</span>
  </a>

  <div class="hidden flex-1 items-center gap-1 md:flex">
    @for (link of navLinks; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="!bg-white/20 !text-white"
        class="cursor-pointer rounded-lg px-4 py-2 text-[14px] font-semibold text-white/70 transition-colors hover:bg-white/10 hover:text-white"
      >
        {{ link.label }}
      </a>
    }
  </div>

  <div class="relative mr-4 ml-auto hidden md:ml-0 lg:block">
    <svg
      class="absolute left-3 top-1/2 -translate-y-1/2 text-white/50"
      width="15" height="15" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
    >
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.3-4.3" />
    </svg>
    <input
      type="search"
      placeholder="Buscar productos..."
      aria-label="Buscar productos"
      class="h-[36px] w-[220px] rounded-xl border border-white/20 bg-white/15 pl-9 pr-4 text-[13px] text-white outline-none transition-all placeholder:text-white/50 focus:border-white/40 focus:bg-white/25"
    />
  </div>

  <a
    routerLink="/carrito"
    aria-label="Ver carrito"
    class="relative mr-1 ml-auto cursor-pointer rounded-xl p-2.5 transition-colors hover:bg-white/15 lg:ml-0"
  >
    <svg
      width="20" height="20" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      class="text-white"
    >
      <circle cx="8" cy="21" r="1" />
      <circle cx="19" cy="21" r="1" />
      <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
    </svg>
    @if (carrito.totalItems() > 0) {
      <span
        class="absolute -right-0.5 -top-0.5 flex size-5 items-center justify-center rounded-full bg-white text-[10px] font-bold text-brand-600"
      >
        {{ carrito.totalItems() }}
      </span>
    }
  </a>

  <a
    routerLink="/mi-cuenta/perfil"
    class="flex cursor-pointer items-center gap-2 rounded-xl border border-white/25 py-2 pl-3 pr-4 transition-colors hover:bg-white/15"
  >
    <span class="flex size-7 items-center justify-center rounded-full bg-white/25">
      <svg
        width="14" height="14" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="text-white"
      >
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
    </span>
    <span class="hidden text-[13px] font-semibold text-white sm:inline">Mi cuenta</span>
  </a>
</nav>
