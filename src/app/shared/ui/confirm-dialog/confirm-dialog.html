<app-ui-modal [title]="title()" size="sm" (closed)="cancelled.emit()">
  <p class="text-[14px] text-muted-foreground">{{ message() }}</p>

  <ng-container slot="footer">
    <button appButton variant="secondary" type="button" (click)="cancelled.emit()">{{ cancelLabel() }}</button>
    <button appButton type="button" (click)="confirmed.emit()">{{ confirmLabel() }}</button>
  </ng-container>
</app-ui-modal>
