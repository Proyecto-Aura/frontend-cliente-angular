<div class="flex min-h-screen bg-surface">
  <!-- Panel de marca (cliente) -->
  <aside
    class="relative hidden w-[48%] shrink-0 flex-col overflow-hidden px-12 py-12 text-white lg:flex"
    style="background: linear-gradient(134deg, #ef4444 6%, #dc2626 59%, #b91c1c 94%)"
  >
    <!-- Círculos decorativos (deriva lentísima, solo transform → GPU) -->
    <span class="animate-drift-a pointer-events-none absolute -left-32 -top-32 size-96 rounded-full bg-white/12"></span>
    <span class="animate-drift-b pointer-events-none absolute right-12 top-10 size-32 rounded-full bg-white/[0.06]"></span>
    <span class="animate-drift-a pointer-events-none absolute bottom-40 left-1/3 size-48 rounded-full bg-white/[0.07]"></span>
    <span class="animate-drift-b pointer-events-none absolute -bottom-8 right-0 size-80 rounded-full bg-white/10"></span>

    <!-- Logo -->
    <div class="animate-fade-up relative flex items-center gap-3">
      <span class="grid size-14 place-items-center rounded-2xl bg-white shadow-[0_10px_15px_-3px_rgba(0,0,0,0.1)]">
        <img ngSrc="/francos-mark.png" width="36" height="34" alt="Franco's" class="h-auto w-9" priority />
      </span>
      <span class="font-display text-[32px] font-extrabold tracking-[-0.5px]">Franco's</span>
    </div>

    <!-- Claim -->
    <h1
      class="animate-fade-up relative mt-auto max-w-md font-display text-[64px] font-black leading-[60px] tracking-[-0.96px] [animation-delay:60ms]"
    >
      ¡Hola,<br /><span class="text-[#ffe2e2]">bienvenido!</span>
    </h1>

    <!-- Features -->
    <ul class="relative mb-2 mt-auto space-y-4 text-[14px] font-medium text-white/85">
      <li class="flex items-center gap-3">
        <span class="grid size-8 place-items-center rounded-[10px] bg-white/15">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" />
            <path d="m9 12 2 2 4-4" />
          </svg>
        </span>
        Acceso seguro y encriptado
      </li>
      <li class="flex items-center gap-3">
        <span class="grid size-8 place-items-center rounded-[10px] bg-white/15">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="7" height="7" x="3" y="3" rx="1" />
            <rect width="7" height="7" x="14" y="3" rx="1" />
            <rect width="7" height="7" x="14" y="14" rx="1" />
            <rect width="7" height="7" x="3" y="14" rx="1" />
          </svg>
        </span>
        Mis pedidos
      </li>
      <li class="flex items-center gap-3">
        <span class="grid size-8 place-items-center rounded-[10px] bg-white/15">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
        </span>
        Atención personalizada
      </li>
    </ul>

    <p class="relative text-[12px] text-white/40">© 2026 Franco's · Todos los derechos reservados</p>
  </aside>

  <!-- Zona de formulario (scrollea si el contenido es más alto que la pantalla) -->
  <main class="flex flex-1 flex-col items-center overflow-y-auto bg-canvas px-6 py-12">
    <router-outlet />
  </main>
</div>
