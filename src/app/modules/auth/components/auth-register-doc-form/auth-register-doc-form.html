<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
  <div>
    <span class="mb-1.5 block text-sm font-semibold text-ink">Tipo de cuenta</span>
    <div class="grid grid-cols-2 gap-2 rounded-[10px] border border-line p-1">
      <button
        type="button"
        (click)="setTipo('persona')"
        [class.bg-brand-600]="tipo === 'persona'"
        [class.text-white]="tipo === 'persona'"
        [class.text-ink-soft]="tipo !== 'persona'"
        class="rounded-lg py-2.5 text-sm font-semibold transition"
      >
        Persona
      </button>
      <button
        type="button"
        (click)="setTipo('empresa')"
        [class.bg-brand-600]="tipo === 'empresa'"
        [class.text-white]="tipo === 'empresa'"
        [class.text-ink-soft]="tipo !== 'empresa'"
        class="rounded-lg py-2.5 text-sm font-semibold transition"
      >
        Empresa
      </button>
    </div>
  </div>

  @if (tipo === 'empresa') {
    <app-auth-input
      label="RUC"
      [control]="documento"
      placeholder="20123456789"
      inputMode="numeric"
      [maxLength]="11"
      hint="11 dígitos"
      error="Ingresa un RUC válido de 11 dígitos."
    />
  } @else {
    <app-auth-input
      label="DNI"
      [control]="documento"
      placeholder="12345678"
      inputMode="numeric"
      [maxLength]="8"
      hint="8 dígitos"
      error="Ingresa un DNI válido de 8 dígitos."
    />
  }

  <button
    type="submit"
    class="mt-2 w-full rounded-[10px] bg-brand-600 py-3.5 text-[15px] font-semibold text-white transition hover:bg-brand-700 focus:ring-2 focus:ring-brand-500/40 focus:outline-none"
  >
    Continuar
  </button>
</form>
