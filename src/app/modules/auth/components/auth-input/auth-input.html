<label class="block">
  <span class="mb-1.5 flex items-center justify-between gap-2">
    <span class="text-sm font-semibold text-ink">{{ label() }}</span>
    <ng-content select="[slot=action]" />
  </span>

  <span class="relative block">
    <input
      [type]="resolvedType()"
      [formControl]="control()"
      [placeholder]="placeholder()"
      [attr.autocomplete]="autocomplete()"
      [class.pr-11]="type() === 'password'"
      class="w-full rounded-[10px] border border-line bg-surface px-4 py-3.5 text-[15px] text-ink outline-none transition placeholder:text-muted focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20"
    />

    @if (type() === 'password') {
      <button
        type="button"
        (click)="show.set(!show())"
        [attr.aria-label]="show() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        class="absolute inset-y-0 right-0 grid w-11 place-items-center text-muted hover:text-ink-soft"
      >
        @if (show()) {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
            <line x1="2" x2="22" y1="2" y2="22" />
          </svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        }
      </button>
    }
  </span>
</label>
