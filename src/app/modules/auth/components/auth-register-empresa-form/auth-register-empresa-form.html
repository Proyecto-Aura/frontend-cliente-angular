<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
  <app-ui-step-progress [step]="paso()" [total]="2" />

  @if (error()) {
    <app-ui-alert tone="danger">{{ error() }}</app-ui-alert>
  }

  @if (paso() === 1) {
    <div class="animate-fade-in flex flex-col gap-5">
      <div class="flex flex-col gap-4">
        <app-auth-section-header [step]="1" [total]="2" title="Datos de Empresa" />
        <app-ui-input label="Razón Social" [formControl]="c.razonSocial" placeholder="Ej: Mi Empresa S.A.C."
          autocomplete="organization" [maxLength]="200" error="Ingresa la razón social." />
      </div>

      <div class="flex flex-col gap-4">
        <app-auth-section-header [step]="2" [total]="2" title="Datos del Contacto" />
        <div class="grid gap-4 sm:grid-cols-2">
          <app-ui-input label="Nombres" [formControl]="c.nombres" placeholder="Ej: Juan Carlos"
            autocomplete="given-name" [maxLength]="100" error="Ingresa los nombres." />
          <app-ui-input label="Apellido paterno" [formControl]="c.apellidoPaterno" placeholder="Ej: García"
            autocomplete="family-name" [maxLength]="100" error="Ingresa el apellido paterno." />
        </div>
        <div class="grid gap-4 sm:grid-cols-2">
          <app-ui-input label="Apellido materno" [formControl]="c.apellidoMaterno" placeholder="Ej: López"
            [maxLength]="100" error="Ingresa el apellido materno." />
          <app-ui-input label="Fecha de nacimiento" [formControl]="c.fechaNacimiento" type="date"
            error="Ingresa la fecha de nacimiento." />
        </div>
      </div>

      <button appButton [block]="true" type="button" (click)="continuar()" [disabled]="!puedePaso1()">
        Continuar
      </button>
    </div>
  } @else {
    <div class="animate-fade-in flex flex-col gap-3">
      <app-auth-section-header [step]="2" [total]="2" title="Datos de Usuario" />
      <div class="mt-3">
        <app-auth-register-user-step
          [email]="c.email" [username]="c.username" [password]="c.password"
          [puedeCrear]="puedeCrear()" [enviando]="enviando()"
          (back)="paso.set(1)" (submit)="onSubmit()" />
      </div>
    </div>
  }
</form>
