<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-8">
  @if (error()) {
    <app-ui-alert tone="danger">{{ error() }}</app-ui-alert>
  }

  <div class="flex flex-col gap-5">
    <app-ui-input
      label="Usuario"
      [formControl]="identificador"
      placeholder="Correo o nombre de usuario"
      autocomplete="username"
    />

    <app-ui-input
      label="Contraseña"
      type="password"
      [formControl]="password"
      placeholder="••••••••"
      autocomplete="current-password"
    >
      <a slot="action" routerLink="/auth/recuperar" class="text-[12px] font-semibold text-brand-600 hover:underline">
        ¿Has olvidado tu contraseña?
      </a>
    </app-ui-input>
  </div>

  <app-ui-checkbox formControlName="recordar">Recordar sesión por 30 días</app-ui-checkbox>

  <button appButton [block]="true" type="submit" [disabled]="enviando()">
    {{ enviando() ? 'Ingresando…' : 'Iniciar Sesión' }}
  </button>

  <p class="flex items-center gap-1 text-[14px] font-medium text-muted">
    ¿No tienes una cuenta?
    <a routerLink="/auth/registro" class="text-brand-600 hover:underline">Regístrate</a>
  </p>
</form>
