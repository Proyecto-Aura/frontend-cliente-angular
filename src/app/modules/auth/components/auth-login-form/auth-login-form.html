<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
  @if (error()) {
    <p class="rounded-[10px] bg-brand-50 px-4 py-3 text-sm text-brand-700" role="alert">
      {{ error() }}
    </p>
  }

  <app-auth-input
    label="Usuario"
    [control]="identificador"
    placeholder="Correo o nombre de usuario"
    autocomplete="username"
  />

  <app-auth-input
    label="Contraseña"
    type="password"
    [control]="password"
    placeholder="••••••••"
    autocomplete="current-password"
  >
    <a slot="action" routerLink="/auth/recuperar" class="text-xs font-bold text-brand-600 hover:underline">
      ¿Has olvidado tu contraseña?
    </a>
  </app-auth-input>

  <label class="flex items-center gap-2.5 pt-2 text-sm text-ink-soft">
    <input
      type="checkbox"
      formControlName="recordar"
      class="size-5 rounded-md border-line text-brand-600 accent-brand-600 focus:ring-brand-500/30"
    />
    Recordar sesión por 30 días
  </label>

  <button
    type="submit"
    [disabled]="enviando()"
    class="mt-2 w-full rounded-[10px] bg-brand-600 py-3.5 text-[15px] font-semibold text-white transition hover:bg-brand-700 focus:ring-2 focus:ring-brand-500/40 focus:outline-none disabled:opacity-60"
  >
    {{ enviando() ? 'Ingresando…' : 'Iniciar sesión' }}
  </button>

  <p class="text-center text-sm text-ink-soft">
    ¿No tienes cuenta?
    <a routerLink="/auth/registro" class="font-semibold text-brand-600 hover:underline">Crear cuenta</a>
  </p>
</form>
