<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
  <app-ui-input
    label="Usuario"
    formControlName="usuario"
    placeholder="admin"
    autocomplete="username"
  />

  <app-ui-input
    label="Contraseña"
    type="password"
    formControlName="password"
    placeholder="admin123"
    autocomplete="current-password"
  >
    <a slot="action" routerLink="/auth/recuperar" class="text-xs font-bold text-brand-600 hover:underline">
      ¿Has olvidado tu contraseña?
    </a>
  </app-ui-input>

  <app-ui-checkbox formControlName="recordar" class="pt-2">Recordar sesión por 30 días</app-ui-checkbox>

  <button appButton size="lg" [block]="true" type="submit" [disabled]="enviando()" class="mt-2">
    Iniciar sesión
  </button>
</form>
