<div class="flex flex-col gap-4">
  <app-ui-input
    label="Email de acceso"
    type="email"
    [formControl]="email()"
    placeholder="correo@ejemplo.com"
    autocomplete="email"
    [maxLength]="150"
    error="Ingresa un correo electrónico válido."
  />

  <div class="grid gap-4 sm:grid-cols-2">
    <app-ui-input
      label="Username"
      [formControl]="username()"
      placeholder="usuario123"
      autocomplete="username"
      [maxLength]="50"
      error="Solo letras, números y . _ - (máx. 50)."
    />
    <app-ui-input
      label="Contraseña"
      type="password"
      [formControl]="password()"
      autocomplete="new-password"
      error="Cumple al menos 3 de las reglas de seguridad."
    />
  </div>

  <app-auth-password-strength [password]="pwdValue()" />

  <div class="flex gap-3 pt-2">
    <button appButton variant="secondary" type="button" (click)="back.emit()" class="flex-1">
      Atrás
    </button>
    <button appButton type="button" [disabled]="!puedeCrear() || enviando()" (click)="submit.emit()" class="flex-1">
      {{ enviando() ? 'Creando cuenta…' : 'Crear cuenta' }}
    </button>
  </div>
</div>
