<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <button type="button" (click)="close.emit()" aria-label="Cerrar" class="animate-fade-in absolute inset-0 cursor-default bg-black/40"></button>

  <div class="animate-scale-in relative w-full max-w-[480px] overflow-hidden rounded-2xl bg-surface shadow-[0px_24px_60px_rgba(0,0,0,0.18)]">
    <div class="flex items-center justify-between border-b border-[#f0f0f0] px-6 py-5">
      <h2 class="font-display text-[15px] font-bold text-ink">Detalle de solicitud</h2>
      <button type="button" (click)="close.emit()" aria-label="Cerrar" class="rounded-lg p-1.5 text-ink-soft transition-colors hover:bg-[#f5f5f5]">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
    </div>

    <div class="flex flex-col gap-4 px-6 py-6">
      <div class="flex items-start gap-3 rounded-xl border p-4" [class]="info().tone">
        <span class="flex size-8 shrink-0 items-center justify-center rounded-lg bg-white/60">
          @switch (ticket().status) {
            @case ('approved') {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335" /><path d="m9 11 3 3L22 4" /></svg>
            }
            @case ('rejected') {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
            }
            @default {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>
            }
          }
        </span>
        <div>
          <p class="text-[13px] font-bold">{{ info().title }}</p>
          <p class="mt-0.5 text-[12px] leading-relaxed opacity-90">{{ info().desc }}</p>
        </div>
      </div>

      @for (campo of campos(); track campo.label) {
        <div class="flex items-start justify-between gap-4 border-b border-[#f5f5f5] py-2 last:border-0">
          <span class="shrink-0 text-[12px] font-medium text-muted">{{ campo.label }}</span>
          <span class="text-right text-[12px] font-semibold text-ink">{{ campo.value }}</span>
        </div>
      }

      <div class="flex flex-col gap-1">
        <span class="text-[12px] font-medium text-muted">Descripción</span>
        <p class="rounded-xl bg-[#fafafa] p-3 text-[12px] leading-relaxed text-label">
          {{ ticket().descripcion }}
        </p>
      </div>
    </div>

    <div class="px-6 pb-6">
      <button appButton variant="secondary" size="lg" [block]="true" type="button" (click)="close.emit()">
        Cerrar
      </button>
    </div>
  </div>
</div>
