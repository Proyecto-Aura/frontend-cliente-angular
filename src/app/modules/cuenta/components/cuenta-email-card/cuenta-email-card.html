<app-ui-card bodyClass="gap-5">
  <div class="flex items-center gap-3">
    <span class="flex size-10 shrink-0 items-center justify-center rounded-full bg-[#fecaca] text-brand-600">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg>
    </span>
    <div>
      <p class="font-display text-[15px] font-semibold text-[#1e1b19]">Verificar Cambio de Correo</p>
      <p class="text-[12px] text-[#574235]">Confirma tu nuevo correo para mantener tu cuenta segura.</p>
    </div>
  </div>

  @if (step() === 'form') {
    <div class="grid grid-cols-1 gap-x-14 gap-y-4 sm:grid-cols-2">
      <app-ui-input label="Correo actual" [value]="currentEmail()" [readonly]="true" />
      <app-ui-input label="Nuevo correo electrónico" type="email" placeholder="nuevo@correo.com" [(value)]="nuevoEmail" />
    </div>

    <div class="flex justify-end">
      <button appButton type="button" (click)="enviarCodigo()" [disabled]="!canSendCode()">
        Enviar código de verificación
      </button>
    </div>
  } @else {
    <app-ui-alert tone="success">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M21.801 10A10 10 0 1 1 17 3.335" /><path d="m9 11 3 3L22 4" /></svg>
      <p>Te enviamos un código de 6 dígitos a <strong>{{ nuevoEmail() }}</strong>.</p>
    </app-ui-alert>

    <label class="flex max-w-[220px] flex-col gap-1.5">
      <span class="text-[13px] font-semibold text-label">Código de verificación</span>
      <input
        [value]="codigo()" (input)="onCodigo($any($event.target).value)"
        inputmode="numeric"
        placeholder="000000"
        class="h-[40px] w-full rounded-xl border border-line-soft bg-surface px-4 text-center text-[13px] tracking-[0.3em] text-label outline-none transition-colors focus:border-brand-600"
      />
    </label>

    <div class="flex flex-wrap items-center gap-3">
      <button appButton type="button" (click)="verificar()" [disabled]="!canVerify()">
        Verificar correo
      </button>
      <button
        type="button"
        (click)="cambiarCorreo()"
        class="text-[13px] font-medium text-ink-soft transition-colors hover:text-brand-600"
      >
        Cambiar correo
      </button>
    </div>
  }
</app-ui-card>
