<button
  type="button"
  class="flex h-10 cursor-pointer items-center gap-3.5 rounded-md px-3.5 text-base text-primary hover:bg-accent disabled:cursor-wait disabled:opacity-60"
  [disabled]="cerrando()"
  (click)="cerrarSesion()"
>
  <svg
    aria-hidden="true"
    class="size-[18px]"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
    <polyline points="16 17 21 12 16 7" />
    <line x1="21" x2="9" y1="12" y2="12" />
  </svg>
  {{ cerrando() ? 'Cerrando sesión…' : 'Cerrar Sesión' }}
</button>
