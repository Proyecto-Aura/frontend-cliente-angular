<div class="flex flex-col gap-5 rounded-2xl border border-[#fca5a5] bg-surface p-6">
  <div class="flex items-center gap-3">
    <span class="flex size-10 shrink-0 items-center justify-center rounded-full bg-[#fecaca] text-brand-600">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
    </span>
    <div>
      <p class="font-display text-[15px] font-semibold text-[#1e1b19]">Cambiar Contraseña</p>
      <p class="text-[12px] text-[#574235]">Usa al menos 8 caracteres. No la compartas con nadie.</p>
    </div>
  </div>

  <div class="grid grid-cols-1 gap-x-14 gap-y-4 sm:grid-cols-2">
    <label class="flex flex-col gap-1.5 sm:col-span-2">
      <span class="text-[13px] font-semibold text-label">Contraseña actual</span>
      <span class="relative block">
        <input
          [type]="verActual() ? 'text' : 'password'"
          [value]="actual()" (input)="actual.set($any($event.target).value)"
          class="h-[40px] w-full rounded-xl border border-line-soft bg-surface px-4 pr-10 text-[13px] text-label outline-none transition-colors focus:border-brand-600"
        />
        <button type="button" (click)="verActual.set(!verActual())" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-ink-soft" [attr.aria-label]="verActual() ? 'Ocultar' : 'Mostrar'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" /></svg>
        </button>
      </span>
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-[13px] font-semibold text-label">Nueva contraseña</span>
      <span class="relative block">
        <input
          [type]="verNueva() ? 'text' : 'password'"
          [value]="nueva()" (input)="nueva.set($any($event.target).value)"
          class="h-[40px] w-full rounded-xl border border-line-soft bg-surface px-4 pr-10 text-[13px] text-label outline-none transition-colors focus:border-brand-600"
        />
        <button type="button" (click)="verNueva.set(!verNueva())" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-ink-soft" [attr.aria-label]="verNueva() ? 'Ocultar' : 'Mostrar'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" /></svg>
        </button>
      </span>
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-[13px] font-semibold text-label">Confirmar nueva contraseña</span>
      <span class="relative block">
        <input
          [type]="verConfirmar() ? 'text' : 'password'"
          [value]="confirmar()" (input)="confirmar.set($any($event.target).value)"
          class="h-[40px] w-full rounded-xl border border-line-soft bg-surface px-4 pr-10 text-[13px] text-label outline-none transition-colors focus:border-brand-600"
        />
        <button type="button" (click)="verConfirmar.set(!verConfirmar())" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-ink-soft" [attr.aria-label]="verConfirmar() ? 'Ocultar' : 'Mostrar'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" /></svg>
        </button>
      </span>
      @if (noCoincide()) {
        <span class="text-[11px] text-brand-600">Las contraseñas no coinciden.</span>
      }
    </label>
  </div>

  <div class="flex justify-end">
    <button
      type="button"
      (click)="enviar()"
      [disabled]="!puedeEnviar()"
      class="flex h-[34px] items-center gap-2 rounded-lg bg-brand-600 px-5 text-[13px] font-semibold text-white transition-colors hover:bg-brand-700 disabled:cursor-not-allowed disabled:opacity-40"
    >
      @if (guardado()) {
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335" /><path d="m9 11 3 3L22 4" /></svg>
        Guardado
      } @else {
        Actualizar Contraseña
      }
    </button>
  </div>
</div>
