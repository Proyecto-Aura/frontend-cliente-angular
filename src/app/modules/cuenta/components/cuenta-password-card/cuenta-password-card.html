<app-ui-card variant="danger" class="gap-5">
  <div class="flex items-center gap-3">
    <span class="flex size-10 shrink-0 items-center justify-center rounded-full bg-[#fecaca] text-brand-600">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
    </span>
    <div>
      <p class="font-display text-[15px] font-semibold text-[#1e1b19]">Cambiar Contraseña</p>
      <p class="text-[12px] text-[#574235]">Usa al menos 8 caracteres. No la compartas con nadie.</p>
    </div>
  </div>

  <div class="grid grid-cols-1 gap-x-14 gap-y-4 sm:grid-cols-2">
    <app-ui-input label="Contraseña actual" type="password" autocomplete="current-password" [(value)]="actual" class="sm:col-span-2" />

    <app-ui-input label="Nueva contraseña" type="password" autocomplete="new-password" [(value)]="nueva" />

    <app-ui-input
      label="Confirmar nueva contraseña"
      type="password"
      autocomplete="new-password"
      [(value)]="confirmar"
      [error]="noCoincide() ? 'Las contraseñas no coinciden.' : null"
    />
  </div>

  <div class="flex justify-end">
    <button appButton type="button" (click)="enviar()" [disabled]="!puedeEnviar()">
      @if (guardado()) {
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335" /><path d="m9 11 3 3L22 4" /></svg>
        Guardado
      } @else {
        Actualizar Contraseña
      }
    </button>
  </div>
</app-ui-card>
