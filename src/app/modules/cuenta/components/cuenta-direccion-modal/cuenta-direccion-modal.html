<app-ui-modal [title]="initial() ? 'Editar dirección' : 'Nueva dirección'" (closed)="close.emit()">
  <div class="flex flex-col gap-4">
    <app-ui-input label="Nombre de la dirección" placeholder="Casa, Oficina…" [(value)]="nombre" />
    <app-ui-input label="Dirección" placeholder="Av. José Larco 1232, Int 402" [(value)]="linea1" />
    <app-ui-select
      label="Distrito"
      placeholder="Selecciona un distrito"
      hint="Ciudad: Lima, Perú"
      [options]="distritoOpciones"
      [(value)]="distrito"
    />
  </div>

  <div slot="footer" class="flex gap-3 pt-1">
    <button appButton variant="secondary" type="button" (click)="close.emit()">Cancelar</button>
    <button appButton type="button" (click)="guardar()" [disabled]="!valido()">
      {{ initial() ? 'Guardar cambios' : 'Agregar' }}
    </button>
  </div>
</app-ui-modal>
