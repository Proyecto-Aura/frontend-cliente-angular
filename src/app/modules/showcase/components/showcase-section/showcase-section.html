<section class="overflow-hidden rounded-lg border border-border bg-white shadow-xs">
  <header class="border-b border-border px-5 py-4">
    <h2 class="text-[16px] font-medium text-foreground">{{ title() }}</h2>
    @if (description()) {
      <p class="mt-0.5 max-w-[720px] text-[12px] text-muted-foreground">{{ description() }}</p>
    }
  </header>

  <div class="p-5">
    <ng-content />
  </div>

  @if (code()) {
    <div class="border-t border-border bg-table-header">
      <div class="flex items-center justify-between px-5 pt-3">
        <span class="text-[12px] text-muted-foreground">Código</span>
        <button appButton variant="secondary" size="sm" type="button" (click)="copy()">
          {{ copied() ? 'Copiado' : 'Copiar' }}
        </button>
      </div>
      <pre class="overflow-x-auto px-5 pt-2 pb-4 font-mono text-[12px] leading-relaxed text-foreground"><code>{{ code() }}</code></pre>
    </div>
  }
</section>
