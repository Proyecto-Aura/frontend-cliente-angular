<div class="flex items-center gap-2.5">
  <span
    class="flex size-7 shrink-0 items-center justify-center rounded-full bg-[#fde4e4] text-primary"
  >
    <app-icon name="user" [size]="14" />
  </span>
  <h2 class="m-0 font-heading text-[15px] font-extrabold text-[#1f1f1f]">Datos del cliente</h2>
</div>
<p class="mt-2 mb-0 text-[11px] text-muted-foreground">
  Datos obtenidos de tu perfil. Si algo no coincide, edítalo en
  <a routerLink="/mi-cuenta/perfil" class="font-semibold text-primary hover:underline">Mi perfil</a
  >.
</p>
<dl
  class="mt-3.5 mb-0 grid grid-cols-[repeat(auto-fit,minmax(min(100%,200px),1fr))] gap-x-[18px] gap-y-3"
>
  <div class="flex flex-col gap-1.5">
    <dt class="text-[11.5px] font-bold text-[#1f1f1f]">Nombre completo</dt>
    <dd
      class="m-0 flex h-9 items-center rounded-lg border border-border bg-[#f5f5f5] px-3 text-[12.5px] text-foreground"
    >
      @if (perfil()) {
        {{ nombre() }}
      } @else {
        <span class="h-3 w-40 animate-pulse rounded bg-[#e0e0e0]" aria-label="Cargando"></span>
      }
    </dd>
  </div>
  <div class="flex flex-col gap-1.5">
    <dt class="text-[11.5px] font-bold text-[#1f1f1f]">Teléfono de contacto</dt>
    <dd
      class="m-0 flex h-9 items-center rounded-lg border border-border bg-[#f5f5f5] px-3 text-[12.5px] text-foreground"
    >
      @if (perfil()) {
        {{ telefono() || 'No registrado' }}
      } @else {
        <span class="h-3 w-28 animate-pulse rounded bg-[#e0e0e0]" aria-label="Cargando"></span>
      }
    </dd>
  </div>
</dl>
