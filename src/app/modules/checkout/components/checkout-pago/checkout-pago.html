<div class="flex items-center gap-2.5">
  <span
    class="flex size-7 shrink-0 items-center justify-center rounded-full bg-[#fde4e4] text-primary"
  >
    <app-icon name="credit-card" [size]="14" />
  </span>
  <h2 class="m-0 font-heading text-[15px] font-extrabold text-[#1f1f1f]">Método de pago</h2>
</div>

<div
  class="mt-3.5 flex items-center gap-3 rounded-lg border border-primary bg-[#fff6f6] px-3.5 py-3"
>
  <span class="flex text-primary"><app-icon name="shield-check" [size]="18" /></span>
  <div class="min-w-0 flex-1">
    <div class="text-[12.5px] font-bold text-[#1f1f1f]">Pago en línea con Culqi</div>
    <ul class="m-0 mt-1 flex list-none flex-wrap gap-1.5 p-0">
      @for (medio of medios; track medio) {
        <li
          class="rounded bg-white px-2 py-0.5 text-[10.5px] font-semibold text-[#424242] ring-1 ring-[#ececec]"
        >
          {{ medio }}
        </li>
      }
    </ul>
  </div>
</div>
<p class="mt-2.5 mb-0 text-[11px] text-muted-foreground">
  Revisa el resumen y pulsa <strong class="font-semibold text-[#1f1f1f]">Pagar</strong> para elegir
  cómo pagar. Tu pedido se registra solo cuando el pago se confirma.
</p>
